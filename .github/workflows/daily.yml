name: Publication quotidienne

on:
  schedule:
    - cron: "7 16 * * *"   # tous les jours à 16:07 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python main.py

      - name: Garder la vidéo (téléchargeable 3 jours)
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/final.mp4
          retention-days: 3

      - name: Sauvegarder l'historique
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add historique.json
          git commit -m "historique $(date +%F)" || echo "rien à commiter"
          git push
